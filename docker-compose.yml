services:
  api:
    build: ./backend
    container_name: pyvelo_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pyvelo-network

  frontend:
    build: ./frontend
    container_name: pyvelo_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pyvelo-network

  worker:
    build: ./backend
    container_name: pyvelo_worker
    command: celery -A app.worker.celery worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pyvelo-network

  beat:
    build: ./backend
    container_name: pyvelo_beat
    command: celery -A app.worker.celery beat -l info
    env_file:
      - .env
    volumes:
      - ./backend:/code
    depends_on:
      - redis
      - db
    networks:
      - pyvelo-network

  db:
    image: postgis/postgis:15-3.3
    container_name: pyvelo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pyvelovaultdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pyvelo-network

  redis:
    image: redis:7-alpine
    container_name: pyvelo_redis
    networks:
      - pyvelo-network

networks:
  pyvelo-network:
    driver: bridge

volumes:
  postgres_data:
    name: pyvelo-vault-data
