[project]
name = "pyvelo-vault"
version = "0.1.0"
description = "A self-hosted cycling activity tracking and analytics platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair==6.0.0",
    "attrs==25.4.0",
    "blinker==1.9.0",
    "cachetools==6.2.4",
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "extra-streamlit-components==0.1.81",
    "gitdb==4.0.12",
    "gitpython==3.1.45",
    "idna==3.11",
    "jinja2==3.1.6",
    "jsonschema==4.25.1",
    "jsonschema-specifications==2025.9.1",
    "markupsafe==3.0.3",
    "narwhals==2.14.0",
    "numpy==2.3.5",
    "packaging==25.0",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "protobuf==6.33.2",
    "pyarrow==22.0.0",
    "pydeck==0.9.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "referencing==0.37.0",
    "requests==2.32.5",
    "rpds-py==0.30.0",
    "six==1.17.0",
    "smmap==5.0.2",
    "streamlit==1.52.2",
    "tenacity==9.1.2",
    "toml==0.10.2",
    "tornado==6.5.4",
    "typing-extensions==4.15.0",
    "tzdata==2025.3",
    "urllib3==2.6.2",
    "watchdog==6.0.0 ; sys_platform != 'darwin'",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.34.2",
    "dependency-injector>=4.48.3",
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.11.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.20",
    "pydantic[email]>=2.12.3",
    "celery[redis]>=5.4.0",
    "stravalib>=1.6",
    "garminconnect>=0.2.36",
    "httpx>=0.28.1",
]
frontend = [
    "streamlit>=1.50.0",
    "extra-streamlit-components>=0.1.81",
    "pandas>=2.3.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "isort>=7.0.0",
    "pre-commit>=4.3.0",
    "ruff>=0.14.6",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.5.2",
    "sphinx-rtd-theme>=3.0.2",
]
test = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",
    "faker>=34.0.0",
]
